services:
  backend:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ANIME_WEATHER_LOG_LEVEL: ${ANIME_WEATHER_LOG_LEVEL:-INFO}
      ANIME_WEATHER_CACHE_TTL: ${ANIME_WEATHER_CACHE_TTL:-1800}
      ANIME_WEATHER_CORS_ORIGINS: ${ANIME_WEATHER_CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://backend:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: http://backend:8000
    restart: unless-stopped

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "anime_weather.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      ANIME_WEATHER_LOG_LEVEL: ${ANIME_WEATHER_LOG_LEVEL:-DEBUG}
      ANIME_WEATHER_CACHE_TTL: ${ANIME_WEATHER_CACHE_TTL:-1800}
      ANIME_WEATHER_CORS_ORIGINS: ${ANIME_WEATHER_CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    image: node:20.18.3-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend-dev:
        condition: service_healthy
    environment:
      VITE_API_URL: http://backend-dev:8000
    restart: unless-stopped

volumes:
  frontend_node_modules:
